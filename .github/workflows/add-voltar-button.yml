name: Adicionar botão Voltar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-voltar-button.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar interface
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '.filtros{display:grid;grid-template-columns:2fr 1fr 1fr 150px 150px;gap:10px;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:16px}'
          new = '.filtros{display:grid;grid-template-columns:2fr 1fr 1fr 150px 150px 150px;gap:10px;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:16px}'
          if old not in s:
              raise SystemExit('Bloco de grid dos filtros não encontrado')
          s = s.replace(old, new, 1)

          old = '.btn-imprimir{background:#4c98ce}.btn-imprimir:hover{background:#3c86bd}'
          new = '.btn-imprimir{background:#4c98ce}.btn-imprimir:hover{background:#3c86bd}.btn-voltar{background:#64748b}.btn-voltar:hover{background:#475569}'
          if old not in s:
              raise SystemExit('CSS do botão imprimir não encontrado')
          s = s.replace(old, new, 1)

          old = '<div><button id="consultar">CONSULTAR</button></div><div><button id="imprimir" class="btn-imprimir oculto">IMPRIMIR</button></div></div>'
          new = '<div><button id="consultar">CONSULTAR</button></div><div><button id="imprimir" class="btn-imprimir oculto">IMPRIMIR</button></div><div><button id="voltar" class="btn-voltar" onclick="window.location.href=\'https://atencao-primaria-horus-contato-6098.vercel.app/\'">VOLTAR</button></div></div>'
          if old not in s:
              raise SystemExit('Bloco de botões não encontrado')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar alteração e remover automação temporária
        run: |
          rm .github/workflows/add-voltar-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-voltar-button.yml
          git commit -m "Adiciona botão Voltar ao painel SIOPS"
          git push
