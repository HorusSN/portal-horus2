name: Corrigir sobreposição do rodapé na impressão

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-print-footer-overlap.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir CSS do rodapé no PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=".secao,.fin-caixa,.card,.hist-card,tr{break-inside:avoid}.rel-rodape{position:fixed;left:0;right:0;bottom:-20mm;border-top:1px solid #6b7280;padding-top:5px;color:#8a8f98;font-size:7.5px;line-height:1.35}"
          new=".secao,.fin-caixa,.card,.hist-card,tr{break-inside:avoid}.rel-rodape{position:static;border-top:1px solid #6b7280;margin-top:12mm;padding-top:5px;color:#8a8f98;font-size:7.5px;line-height:1.35;break-inside:avoid}"
          if old not in s:
              raise SystemExit('CSS esperado do rodapé não encontrado')
          s=s.replace(old,new,1)
          s=s.replace("@media print{html,body{background:#fff!important}.screen-tools{display:none}","@media print{html,body{background:#fff!important}.screen-tools{display:none}.rel-rodape{position:static!important;left:auto!important;right:auto!important;bottom:auto!important;margin-top:12mm!important;page-break-inside:avoid;break-inside:avoid}",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar correção
        run: |
          rm .github/workflows/fix-print-footer-overlap.yml
          git config user.name "Hórus Portal Bot"
          git config user.email "contato@horusservicosenegocios.com.br"
          git add index.html .github/workflows/fix-print-footer-overlap.yml
          git commit -m "Corrige rodapé sobreposto ao cabeçalho nas páginas do PDF"
          git push
